build-linux:
  name: Build Linux
  runs-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build
      run: |
        python -m PyInstaller WoWLauncher-Linux.spec --noconfirm --clean

    - name: Package
      run: |
        cd dist
        tar -czf ../WoWLauncher-Linux.tar.gz WoWLauncher

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: WoWLauncher-Linux
        path: WoWLauncher-Linux.tar.gz
