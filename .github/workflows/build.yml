name: Build WoW Launcher

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows application
        run: |
          python -m PyInstaller WoWLauncher-Windows.spec --noconfirm --clean

      - name: Create Windows ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\WoWLauncher\*" `
            -DestinationPath "WoWLauncher-Windows.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WoWLauncher-Windows
          path: WoWLauncher-Windows.zip


  # ==========================================
  # MACOS
  # ==========================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS application
        run: |
          python -m PyInstaller WoWLauncher-macOS.spec --noconfirm --clean

      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r ../WoWLauncher-macOS.zip WoWLauncher.app

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: WoWLauncher-macOS
          path: WoWLauncher-macOS.zip


  # ==========================================
  # LINUX
  # ==========================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show repository structure
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f | sort

      - name: Build Linux application
        run: |
          python -m PyInstaller WoWLauncher-Linux.spec --noconfirm --clean

      - name: Create Linux archive
        run: |
          cd dist
          tar -czf ../WoWLauncher-Linux.tar.gz WoWLauncher

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: WoWLauncher-Linux
          path: WoWLauncher-Linux.tar.gz


  # ==========================================
  # GITHUB RELEASE
  # ==========================================
  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-macos
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: WoWLauncher-Windows
          path: release

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: WoWLauncher-macOS
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: WoWLauncher-Linux
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WoWLauncher-Windows.zip
            release/WoWLauncher-macOS.zip
            release/WoWLauncher-Linux.tar.gz
          generate_release_notes: true
